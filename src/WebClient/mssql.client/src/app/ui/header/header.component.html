<header class="header">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="#">
      <i class="fa fa-database"></i> MSSQL Management
    </a>
    
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item" *ngIf="!isAuthenticated">
          <button class="btn btn-outline-light btn-sm" (click)="navigateToLogin()">
            <i class="fa fa-sign-in"></i> Login
          </button>
        </li>
        
        <li class="nav-item dropdown" *ngIf="isAuthenticated">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" 
             data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fa fa-user-circle"></i> 
            {{ currentUser?.fullName || currentUser?.userName || 'User' }}
          </a>
          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
            <a class="dropdown-item" href="#">
              <i class="fa fa-user"></i> Profile
            </a>
            <a class="dropdown-item" href="#">
              <i class="fa fa-cog"></i> Settings
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="#" (click)="logout(); $event.preventDefault()">
              <i class="fa fa-sign-out"></i> Logout
            </a>
          </div>
        </li>
      </ul>
    </div>
  </nav>
</header>
