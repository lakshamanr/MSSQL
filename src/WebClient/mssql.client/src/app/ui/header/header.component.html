<header class="header">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand" routerLink="/">
      <i class="fa fa-database"></i> MSSQL Management
    </a>

    <!-- Dashboard menu next to brand (left side) -->
    <ul class="navbar-nav navbar-nav-left" *ngIf="isAuthenticated">
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
          <i class="fa fa-home"></i> Dashboard
        </a>
      </li>
    </ul>

    <button class="navbar-toggler" type="button"
            (click)="isNavbarCollapsed = !isNavbarCollapsed"
            [attr.aria-expanded]="!isNavbarCollapsed"
            aria-controls="navbarNav"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse"
         id="navbarNav"
         [class.show]="!isNavbarCollapsed">
      <!-- Dashboard link for mobile (inside collapse) -->
      <ul class="navbar-nav mobile-nav" *ngIf="isAuthenticated">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="isNavbarCollapsed = true">
            <i class="fa fa-home"></i> Dashboard
          </a>
        </li>
      </ul>

      <!-- Right side user menu -->
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" *ngIf="!isAuthenticated">
          <button class="btn btn-outline-light btn-sm" (click)="navigateToLogin()">
            <i class="fa fa-sign-in"></i> Login
          </button>
        </li>

        <li class="nav-item" *ngIf="isAuthenticated">
          <span class="navbar-text user-info">
            <i class="fa fa-user-circle"></i>
            {{ currentUser?.fullName || currentUser?.userName || 'User' }}
          </span>
        </li>

        <li class="nav-item" *ngIf="isAuthenticated">
          <button class="btn btn-outline-light btn-sm" (click)="logout()">
            <i class="fa fa-sign-out"></i> Logout
          </button>
        </li>
      </ul>
    </div>
  </nav>
</header>
