export default "<amexio-accordion [multi-open]=\"true\">\r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" header=\"All Scalar Functions \" [gradient]=\"true\"\r\n                        [active]=\"true\">\r\n    <hr />\r\n    <input type=\"text\" class=\"form-control\" placeholder=\"Search\" id=\"listSearch\">\r\n    <hr />\r\n    <div class=\"table\">\r\n      <div class=\"row header\">\r\n        <div class=\"cell\">Scalar Functions </div>\r\n        <div class=\"cell\">MS Descriptions</div>\r\n      </div>\r\n      <div *ngFor=\"let scalarfunction of functionDescriptions | keyvalue\" class=\"row\">\r\n\r\n        <div class=\"cell\"><a [routerLink]=\"['/ScalarFunction', scalarfunction.key ]\"> {{ scalarfunction.key }}</a></div>\r\n        <div class=\"cell\">{{ scalarfunction.value }}</div>\r\n      </div>\r\n    </div>\r\n  </amexio-accordion-tab>\r\n\r\n</amexio-accordion>\r\n"
