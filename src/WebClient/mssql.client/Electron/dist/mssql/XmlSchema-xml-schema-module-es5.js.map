export default "<amexio-accordion [multi-open]=\"true\">\r\n\r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" [gradient]=\"true\" header=\"All XML Schema\" [active]=\"true\">\r\n    <hr />\r\n    <input type=\"text\" class=\"form-control\" placeholder=\"Search\" >\r\n    <hr />\r\n    <div class=\"table\">\r\n      <div class=\"row header\">\r\n        <div class=\"cell\">XML Schema</div>\r\n        <div class=\"cell\">MS Descriptions</div>\r\n      </div>\r\n      <div *ngFor=\"let Property of collections  \" class=\"row\">\r\n        <a [innerHTML]=\"Property.xmlSchemaCollections\" class=\"cell\" data-title=\"Property\" [routerLink]=\"['/XmlSchema',Property.xmlSchemaCollections]\"> {{Property.xmlSchemaCollections}}</a>\r\n        <div [innerHTML]=\"Property.mS_Description\" class=\"cell\" data-title=\"Value\">{{Property.mS_Description}}</div>\r\n\r\n      </div>\r\n    </div>\r\n  </amexio-accordion-tab>\r\n\r\n</amexio-accordion>\r\n"
