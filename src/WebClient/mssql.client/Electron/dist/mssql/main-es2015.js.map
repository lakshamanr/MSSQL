export default "<div class=\"code-container\">\r\n  <ngx-prism *ngIf=\"code && code.length > 0\" [language]=\"language\">\r\n    {{ code }}\r\n  </ngx-prism>\r\n  <div *ngIf=\"!code || code.length === 0\" class=\"no-code-message\">\r\n    <p>No code available to display</p>\r\n  </div>\r\n</div>\r\n"
