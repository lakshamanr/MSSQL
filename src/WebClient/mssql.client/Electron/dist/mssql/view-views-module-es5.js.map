export default " \r\n \r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\"  header=\"Views\" [active]=\"true\">\r\n    <p-table [columns]=\"cols\" [value]=\"viewDetails\" dataKey=\"viewName\" [paginator]=\"true\" [rows]=\"20\">\r\n      <ng-template pTemplate=\"header\" let-columns>\r\n        <tr>\r\n         \r\n          <th>View Name</th>\r\n          <th>Description</th>\r\n        </tr>\r\n      </ng-template>\r\n      <ng-template pTemplate=\"body\" let-rowData let-expanded=\"expanded\" let-columns=\"columns\">\r\n        <tr>\r\n          <td class=\"cell\"> <a class=\"cell\" data-title=\"Name\" [routerLink]=\"['/View',rowData.viewName]\"> {{rowData.viewName}}</a></td>\r\n          <td class=\"cell\">{{rowData.viewExtendedProperties}}</td>\r\n        </tr>\r\n      </ng-template>\r\n     \r\n    </p-table>\r\n  </amexio-accordion-tab>\r\n \r\n"
