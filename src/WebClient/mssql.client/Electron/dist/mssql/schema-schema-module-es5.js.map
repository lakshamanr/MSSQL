export default "<amexio-accordion [multi-open]=\"true\">\r\n\r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" [gradient]=\"true\" header=\"All Schemas\" [active]=\"true\">\r\n    <hr />\r\n    <input type=\"text\" class=\"form-control\" placeholder=\"Search\">\r\n    <hr />\r\n    <div class=\"table\">\r\n      <div class=\"row header\">\r\n        <div class=\"cell\">Schemas</div>\r\n        <div class=\"cell\">MS Descriptions</div>\r\n      </div>\r\n      <div *ngFor=\"let Property of schemas   \" class=\"row\">\r\n        <a [innerHTML]=\"Property.schemaName  \" class=\"cell\" data-title=\"Property\"> {{Property.schemaName}}</a>\r\n        <div [innerHTML]=\"Property.description  \" class=\"cell\" data-title=\"Value\">{{Property.description}}</div>\r\n\r\n      </div>\r\n    </div>\r\n  </amexio-accordion-tab>\r\n\r\n</amexio-accordion>\r\n"
