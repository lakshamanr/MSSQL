export default "<app-header></app-header>\r\n<div id=\"main-content\">\r\n  <div class=\"split-example ex-percent\">\r\n    <as-split unit=\"percent\"\r\n              direction=\"horizontal\"\r\n              #split=\"asSplit\"\r\n              [gutterSize]=\"10\"\r\n              [useTransition]=\"useTransition\"\r\n              (dragStart)=\"log('dragStart', $event)\"\r\n              (dragEnd)=\"log('dragEnd', $event)\"\r\n              (gutterClick)=\"toggleSidebar()\"\r\n              (gutterDblClick)=\"toggleSidebar()\">\r\n\r\n      <as-split-area [size]=\"25\"\r\n                     [minSize]=\"0\"\r\n                     [maxSize]=\"50\"\r\n                     #area1=\"asSplitArea\" id=\"asSplitArea1\">\r\n        <div class=\"leftmenuExtendedProperties\">\r\n          <!-- Fixed Top Section -->\r\n          <div class=\"database-section\">\r\n            <app-database-selector></app-database-selector>\r\n          </div>\r\n\r\n          <!-- Scrollable Bottom Section -->\r\n          <div class=\"menu-section\">\r\n            <app-leftmenu></app-leftmenu>\r\n          </div>\r\n        </div>\r\n      </as-split-area>\r\n\r\n\r\n\r\n      <!-- Right Panel - Main Content -->\r\n      <as-split-area [size]=\"75\"\r\n                     [ngClass]=\"status ? 'ShowFullPageMode' : 'RemoveFullPageMode'\"\r\n                     #area2=\"asSplitArea\"\r\n                     id=\"asSplitArea2\">\r\n        <div class=\"main-area\">\r\n          <button class=\"menu-toggle\" (click)=\"toggleSidebar()\">\r\n            <i class=\"fa fa-bars\"></i>\r\n          </button>\r\n          <div id=\"center\">\r\n            <router-outlet></router-outlet>\r\n          </div>\r\n        </div>\r\n      </as-split-area>\r\n\r\n    </as-split>\r\n  </div>\r\n\r\n  <!-- Overlay for Sidebar -->\r\n  <div class=\"overlay\" [class.active]=\"!status\" (click)=\"toggleSidebar()\"></div>\r\n</div>\r\n"
