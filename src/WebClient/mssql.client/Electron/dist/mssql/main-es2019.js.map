export default " \r\n<amexio-accordion [multi-open]=\"true\">\r\n\r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" [gradient]=\"true\" header=\"User Defined Data Type\" [active]=\"true\">\r\n    <hr />\r\n    <input type=\"text\" class=\"form-control\" placeholder=\"Search\">\r\n    <hr />\r\n    <div class=\"table\">\r\n      <div class=\"row header\">\r\n        <div class=\"cell\">Name</div>\r\n      </div>\r\n      <div *ngFor=\"let Property of userDefinedDataTypes   \" class=\"row\">\r\n        <a [innerHTML]=\"Property.name\" class=\"cell\" data-title=\"Property\" [routerLink]=\"['/UserDefinedDataType',Property.name]\"> {{Property.name}}\r\n        </a>  \r\n      </div>\r\n    </div>\r\n  </amexio-accordion-tab>\r\n\r\n</amexio-accordion>\r\n"
