export default "\r\n \r\n<amexio-accordion [multi-open]=\"true\">\r\n    <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" header=\"All Aggregate Functions \" [gradient]=\"true\"\r\n                          [active]=\"true\">\r\n      <hr />\r\n      <input type=\"text\" class=\"form-control\" placeholder=\"Search\" id=\"listSearch\">\r\n      <hr />\r\n      <div class=\"table\">\r\n        <div class=\"row header\">\r\n          <div class=\"cell\">Aggregate Functions </div>\r\n          <div class=\"cell\">MS Descriptions</div>\r\n        </div>\r\n        <div *ngFor=\"let function of functionDescriptions | keyvalue\" class=\"row\">\r\n          <div class=\"cell\"><a [routerLink]=\"['/AggregateFunction', function.key ]\"> {{ function.key }}</a></div>\r\n          <div class=\"cell\">{{ function.value }}</div>\r\n        </div>\r\n      </div>\r\n    </amexio-accordion-tab>\r\n  \r\n  </amexio-accordion>\r\n"
