export default "<amexio-accordion [multi-open]=\"true\">\r\n\r\n  <amexio-accordion-tab amexioColorPalette [color-palette]=\"''\" [gradient]=\"true\" header=\"All Triggers\" [active]=\"true\">\r\n    <hr />\r\n    <input type=\"text\" class=\"form-control\" placeholder=\"Search\">\r\n    <hr />\r\n    <div class=\"table\">\r\n      <div class=\"row header\">\r\n        <div class=\"cell\">Triggers</div>\r\n        <div class=\"cell\">MS Descriptions</div>\r\n      </div>\r\n      <div *ngFor=\"let Property of triggers   \" class=\"row\">\r\n        <a [innerHTML]=\"Property.name  \" class=\"cell\" data-title=\"Property\" [routerLink]=\"['/Trigger',Property.name]\"> {{Property.name}}</a>\r\n        <div [innerHTML]=\"Property.description  \" class=\"cell\" data-title=\"Value\">{{Property.istrValue}}</div>\r\n\r\n      </div>\r\n    </div>\r\n  </amexio-accordion-tab>\r\n\r\n</amexio-accordion>\r\n"
